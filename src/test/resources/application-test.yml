spring:
  datasource:
    url: jdbc:h2:mem:attendance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-integration-tests-that-is-long-enough-for-hs512-algorithm!!
    issuer: attendance-saas-test
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 7

logging:
  level:
    root: WARN
    com.attendance.saas: INFO
